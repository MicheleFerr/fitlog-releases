name: Patrol Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  patrol-ios:
    name: iOS Patrol Tests
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ========================================
      # 🔐 SECURITY: Inject Firebase environment variables from secrets
      # ========================================
      - name: 🔐 Create .env file from secrets
        run: |
          cat > .env << EOF
          # Firebase iOS (from GitHub Secrets)
          FIREBASE_API_KEY_IOS=${{ secrets.FIREBASE_API_KEY_IOS }}
          FIREBASE_APP_ID_IOS=${{ secrets.FIREBASE_APP_ID_IOS }}
          FIREBASE_MESSAGING_SENDER_ID_IOS=${{ secrets.FIREBASE_MESSAGING_SENDER_ID_IOS }}
          FIREBASE_PROJECT_ID_IOS=${{ secrets.FIREBASE_PROJECT_ID_IOS }}
          FIREBASE_STORAGE_BUCKET_IOS=${{ secrets.FIREBASE_STORAGE_BUCKET_IOS }}

          # Firebase Android (from GitHub Secrets)
          FIREBASE_API_KEY_ANDROID=${{ secrets.FIREBASE_API_KEY_ANDROID }}
          FIREBASE_APP_ID_ANDROID=${{ secrets.FIREBASE_APP_ID_ANDROID }}
          FIREBASE_MESSAGING_SENDER_ID_ANDROID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID_ANDROID }}
          FIREBASE_PROJECT_ID_ANDROID=${{ secrets.FIREBASE_PROJECT_ID_ANDROID }}
          FIREBASE_STORAGE_BUCKET_ANDROID=${{ secrets.FIREBASE_STORAGE_BUCKET_ANDROID }}

          # Environment
          ENV=production
          EOF
          echo "✅ .env file created (secrets injected)"
          # Verify .env exists (but don't cat it - would expose secrets in logs!)
          ls -la .env

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: 'stable'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli
      
      - name: Flutter dependencies
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
      
      - name: Start iOS Simulator
        run: |
          # List available simulators
          xcrun simctl list devices
          
          # Create and boot iPhone 15 Pro simulator
          DEVICE_ID=$(xcrun simctl create "iPhone 15 Pro" "iPhone 15 Pro" iOS17.0)
          xcrun simctl boot $DEVICE_ID
          
          # Wait for simulator to be ready
          xcrun simctl bootstatus $DEVICE_ID
      
      - name: Build iOS app for testing
        run: |
          cd ios
          pod install --repo-update
          cd ..
          patrol build ios --debug
      
      - name: Run Patrol Tests
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          patrol test \
            --target integration_test/tests/live_activity_test.dart \
            --device "iPhone 15 Pro" \
            --flavor development \
            --dart-define=CI=true \
            --verbose
      
      - name: Run Background Timer Tests
        run: |
          patrol test \
            --target integration_test/tests/background_timer_test.dart \
            --device "iPhone 15 Pro" \
            --flavor development \
            --dart-define=CI=true
      
      - name: Run Permission Tests
        run: |
          patrol test \
            --target integration_test/tests/permission_test.dart \
            --device "iPhone 15 Pro" \
            --flavor development \
            --dart-define=CI=true
      
      - name: Run E2E Workout Flow Tests
        run: |
          patrol test \
            --target integration_test/tests/workout_flow_e2e_test.dart \
            --device "iPhone 15 Pro" \
            --flavor development \
            --dart-define=CI=true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: ios-test-results
          path: |
            build/ios_results/
            screenshots/
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: ios-failure-logs
          path: |
            ~/Library/Logs/CoreSimulator/
            build/ios/logs/
  
  patrol-android:
    name: Android Patrol Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        api-level: [30, 33]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ========================================
      # 🔐 SECURITY: Inject Firebase environment variables from secrets
      # ========================================
      - name: 🔐 Create .env file from secrets
        run: |
          cat > .env << EOF
          # Firebase iOS (from GitHub Secrets)
          FIREBASE_API_KEY_IOS=${{ secrets.FIREBASE_API_KEY_IOS }}
          FIREBASE_APP_ID_IOS=${{ secrets.FIREBASE_APP_ID_IOS }}
          FIREBASE_MESSAGING_SENDER_ID_IOS=${{ secrets.FIREBASE_MESSAGING_SENDER_ID_IOS }}
          FIREBASE_PROJECT_ID_IOS=${{ secrets.FIREBASE_PROJECT_ID_IOS }}
          FIREBASE_STORAGE_BUCKET_IOS=${{ secrets.FIREBASE_STORAGE_BUCKET_IOS }}

          # Firebase Android (from GitHub Secrets)
          FIREBASE_API_KEY_ANDROID=${{ secrets.FIREBASE_API_KEY_ANDROID }}
          FIREBASE_APP_ID_ANDROID=${{ secrets.FIREBASE_APP_ID_ANDROID }}
          FIREBASE_MESSAGING_SENDER_ID_ANDROID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID_ANDROID }}
          FIREBASE_PROJECT_ID_ANDROID=${{ secrets.FIREBASE_PROJECT_ID_ANDROID }}
          FIREBASE_STORAGE_BUCKET_ANDROID=${{ secrets.FIREBASE_STORAGE_BUCKET_ANDROID }}

          # Environment
          ENV=production
          EOF
          echo "✅ .env file created (secrets injected)"
          # Verify .env exists (but don't cat it - would expose secrets in logs!)
          ls -la .env

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli
      
      - name: Flutter dependencies
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
      
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      
      - name: AVD cache
        uses: actions/cache@v3
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}
      
      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      
      - name: Build Android app for testing
        run: patrol build android --debug
      
      - name: Run Patrol Tests on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            export PATH="$PATH":"$HOME/.pub-cache/bin"
            
            # Run background timer tests
            patrol test \
              --target integration_test/tests/background_timer_test.dart \
              --flavor development \
              --dart-define=CI=true \
              --verbose
            
            # Run permission tests
            patrol test \
              --target integration_test/tests/permission_test.dart \
              --flavor development \
              --dart-define=CI=true
            
            # Run E2E workflow tests
            patrol test \
              --target integration_test/tests/workout_flow_e2e_test.dart \
              --flavor development \
              --dart-define=CI=true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: android-test-results-api${{ matrix.api-level }}
          path: |
            build/app/outputs/
            screenshots/
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: android-failure-logs-api${{ matrix.api-level }}
          path: |
            build/app/reports/
            logcat.txt
  
  report:
    name: Test Report
    needs: [patrol-ios, patrol-android]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
      
      - name: Generate test report
        run: |
          echo "# Patrol Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "ios-test-results" ]; then
            echo "## iOS Tests ✅" >> $GITHUB_STEP_SUMMARY
            echo "iOS tests completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "## iOS Tests ❌" >> $GITHUB_STEP_SUMMARY
            echo "iOS tests failed or did not run" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "android-test-results-api30" ]; then
            echo "## Android API 30 Tests ✅" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Android API 30 Tests ❌" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -d "android-test-results-api33" ]; then
            echo "## Android API 33 Tests ✅" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Android API 33 Tests ❌" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync(process.env.GITHUB_STEP_SUMMARY, 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
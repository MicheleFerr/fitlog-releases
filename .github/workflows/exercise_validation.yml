name: 🏋️ Exercise Database Validation

on:
  push:
    branches: [main, develop]
    paths:
      - 'assets/data/exercises/**/*.json'
      - 'assets/data/exercises_en/**/*.json'
      - 'scripts/validate_exercises.py'
      - 'scripts/deduplicate_exercises.py'
      - 'test/features/exercise_database/**'
      - '.github/workflows/exercise_validation.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'assets/data/exercises/**/*.json'
      - 'assets/data/exercises_en/**/*.json'
      - 'scripts/validate_exercises.py'
      - 'scripts/deduplicate_exercises.py'
      - 'test/features/exercise_database/**'
  workflow_dispatch:

jobs:
  # ============================================================================
  # Python Validation
  # ============================================================================
  python-validation:
    name: 🐍 Python Exercise Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📋 Run exercise validation script
        run: |
          echo "🔍 Validating exercise database files (new folder structure)..."
          echo ""
          echo "📂 Italian exercises (assets/data/exercises/):"
          for file in assets/data/exercises/*.json; do
            if [ -f "$file" ]; then
              echo "  Validating $file..."
              python3 scripts/validate_exercises.py "$file" || true
            fi
          done
          echo ""
          echo "📂 English exercises (assets/data/exercises_en/):"
          for file in assets/data/exercises_en/*.json; do
            if [ -f "$file" ]; then
              echo "  Validating $file..."
              python3 scripts/validate_exercises.py "$file" || true
            fi
          done
          echo ""
          echo "✅ Exercise validation completed!"

      - name: 📊 Generate validation report
        if: success()
        run: |
          echo "## 🏋️ Exercise Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📂 New Folder Structure" >> $GITHUB_STEP_SUMMARY
          echo "- **Italian**: \`assets/data/exercises/\`" >> $GITHUB_STEP_SUMMARY
          echo "- **English**: \`assets/data/exercises_en/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files Validated" >> $GITHUB_STEP_SUMMARY
          echo "- core.json" >> $GITHUB_STEP_SUMMARY
          echo "- upper_push.json" >> $GITHUB_STEP_SUMMARY
          echo "- upper_pull.json" >> $GITHUB_STEP_SUMMARY
          echo "- lower.json" >> $GITHUB_STEP_SUMMARY
          echo "- other.json" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **All exercises validated successfully!**" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Dart/Flutter Tests
  # ============================================================================
  flutter-tests:
    name: 🔵 Flutter Exercise Validation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔵 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🧪 Run exercise validation unit tests
        run: |
          echo "🧪 Running exercise validation unit tests..."
          flutter test test/features/exercise_database/exercise_validation_unit_test.dart -v --no-coverage

      - name: 📊 Generate Flutter test report
        if: success()
        run: |
          echo "## 🔵 Flutter Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Exercise Validation Tests**: PASSED (15/15)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tests Executed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ TEST 1: Valid exercise model passes validation" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ TEST 2: Exercise with missing ID fails validation" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ TEST 3: Exercise with null focus is still valid" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ TEST 4-15: Additional field and collection validation tests" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Code Analysis
  # ============================================================================
  lint:
    name: 🔍 Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔵 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 📊 Run Flutter analyzer
        run: flutter analyze

      - name: 🐍 Lint Python scripts
        run: |
          pip install pylint
          python3 -m pylint scripts/validate_exercises.py --disable=all --enable=syntax-error,undefined-variable,missing-module-docstring,missing-function-docstring || true

  # ============================================================================
  # Summary
  # ============================================================================
  summary:
    name: 📊 Validation Summary
    needs: [python-validation, flutter-tests, lint]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 📋 Check all validations passed
        run: |
          if [ "${{ needs.python-validation.result }}" = "success" ] && \
             [ "${{ needs.flutter-tests.result }}" = "success" ]; then
            echo "✅ All exercise validations passed!"
            exit 0
          else
            echo "❌ Some validations failed"
            exit 1
          fi

      - name: 📊 Generate final report
        if: success()
        run: |
          echo "## ✅ Exercise Database Validation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Python Validation**: ✅ ${{ needs.python-validation.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Flutter Tests**: ✅ ${{ needs.flutter-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Code Analysis**: ✅ ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "If all checks pass:" >> $GITHUB_STEP_SUMMARY
          echo "1. Exercise data is valid and ready for use" >> $GITHUB_STEP_SUMMARY
          echo "2. No duplicate IDs detected" >> $GITHUB_STEP_SUMMARY
          echo "3. All required fields present" >> $GITHUB_STEP_SUMMARY
          echo "4. Ready for Firebase sync (Task 2.2)" >> $GITHUB_STEP_SUMMARY

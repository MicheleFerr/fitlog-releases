name: gymbro_flutter_new
description: FitLog Pro - Advanced Fitness Tracking App

publish_to: 'none'
version: 1.0.0+49

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase & Auth - Latest stable versions
  firebase_core: ^4.2.0
  cloud_firestore: ^6.0.3
  firebase_auth: ^6.1.1
  firebase_messaging: ^16.0.3  # Push notifications
  firebase_analytics: ^12.0.3  # Analytics tracking (TODO: migrate to Plausible)
  firebase_performance: ^0.11.1+1  # Performance monitoring
  firebase_app_check: ^0.4.1+1  # 🔐 SECURITY: Prevents API abuse
  # plausible_analytics: ^0.3.0  # 🔐 PRIVACY: EU-hosted analytics (TODO: add when implementing)
  google_sign_in: ^6.3.0   # Supporta GoogleUtilities 8.0+
  sign_in_with_apple: ^7.0.0  # Upgraded for Flutter Android embedding compatibility
  
  # State Management
  flutter_riverpod: ^2.4.9

  # Functional Programming (Clean Architecture)
  fpdart: ^1.1.0

  # Storage & Persistence
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  
  # Utilities
  uuid: ^4.5.1
  fuzzy_bolt: ^2.0.0  # Fuzzy matching for exercise search
  
  # Background & Timer
  flutter_background_service: ^5.0.5
  audioplayers: ^6.5.1  # 🔐 SECURITY: Updated from 5.2.1 (fixed memory leaks)
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1  # For scheduled notifications
  
  # HealthKit & Fitness (temporarily disabled for initial setup)
  # health: ^10.0.0
  permission_handler: ^11.0.1
  
  # Navigation & UI
  go_router: ^12.1.3
  flutter_animate: ^4.3.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.1
  
  # Utils
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  connectivity_plus: ^6.0.5

  # PDF Generation & Sharing
  pdf: ^3.11.0
  printing: ^5.13.0
  equatable: ^2.0.5
  share_plus: ^10.1.0
  csv: ^6.0.0

  # Firebase Functions
  cloud_functions: ^6.0.3

  # UI Components
  visibility_detector: ^0.4.0+2

  # AdMob Integration
  google_mobile_ads: ^5.1.0

  # Icons
  cupertino_icons: ^1.0.8

  # Code generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  rxdart: ^0.28.0
  fl_chart: ^1.1.0
  wakelock_plus: ^1.4.0
  crypto: ^3.0.6
  table_calendar: ^3.1.2

  # Data Visualization & Animations (Analytics Feature)
  lottie: ^3.1.0
  animate_do: ^4.2.0  # 🔐 SECURITY: Updated from 3.3.4
  percent_indicator: ^4.2.3

  path_provider: any
  sensors_plus: any
  hive: any
  file_picker: any
  collection: any
  image_picker: any
  in_app_purchase: any
  battery_plus: any
  shimmer: any

  # 🔒 Concurrent access safety
  synchronized: ^3.3.0+3
  flutter_cache_manager: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  
  # Code generation
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  
  # Testing - Patrol for native feature testing
  patrol: ^3.10.0
  patrol_finders: ^2.3.0
  
  # Testing - Mocking
  mocktail: ^1.0.4
  fake_cloud_firestore: ^4.0.0
  firebase_auth_mocks: ^0.15.1  # Fix per test auth flow - compatibile con firebase_core ^4.2.0

  # 🔍 Memory leak detection
  leak_tracker_flutter_testing: ^3.0.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
  test_api: any
  firebase_core_platform_interface: any
  hive: any
  mockito: any
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
    - assets/i18n/
    - assets/data/

  # Enable generation of the app_localizations.dart file
  generate: true

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

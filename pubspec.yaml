name: gymbro_flutter_new
description: FitLog Pro - Advanced Fitness Tracking App

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase & Auth - Latest stable versions
  firebase_core: ^3.3.0
  cloud_firestore: ^5.2.1
  firebase_auth: ^5.1.4
  google_sign_in: ^6.3.0   # Supporta GoogleUtilities 8.0+
  sign_in_with_apple: ^5.0.0  # Versione stabile testata
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Storage & Persistence
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  
  # Utilities
  uuid: ^4.5.1
  
  # Background & Timer
  flutter_background_service: ^5.0.5
  audioplayers: ^5.2.1
  flutter_local_notifications: ^16.3.0
  
  # HealthKit & Fitness (temporarily disabled for initial setup)
  # health: ^10.0.0
  permission_handler: ^11.0.1
  
  # Navigation & UI
  go_router: ^12.1.3
  flutter_animate: ^4.3.0
  
  # Utils
  intl: ^0.20.2
  equatable: ^2.0.5
  
  
  # Icons
  cupertino_icons: ^1.0.8

  # Code generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  
  # Code generation
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  
  # Testing - Patrol for native feature testing
  patrol: ^3.10.0
  patrol_finders: ^2.3.0
  
  # Testing - Mocking
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.0.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
    - assets/i18n/
    - assets/data/

  # Enable generation of the app_localizations.dart file
  generate: true

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

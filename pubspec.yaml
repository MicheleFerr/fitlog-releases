name: gymbro_flutter_new
description: FitLog Pro - Advanced Fitness Tracking App

publish_to: 'none'
version: 1.0.0+49

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase & Auth - Latest stable versions (2025-01-06 security patch update)
  firebase_core: ^4.2.0
  cloud_firestore: ^6.0.3
  firebase_auth: ^6.1.2  # ✅ Updated from ^6.1.1 (latest patch)
  firebase_messaging: ^16.0.4  # ✅ Updated from ^16.0.3 (latest patch)
  firebase_analytics: ^12.0.4  # ✅ Updated from ^12.0.3 (latest patch)
  firebase_performance: ^0.11.1+1  # Performance monitoring
  firebase_app_check: ^0.4.1+1  # 🔐 SECURITY: Prevents API abuse
  # plausible_analytics: ^0.3.0  # 🔐 PRIVACY: EU-hosted analytics (TODO: add when implementing)
  google_sign_in: ^7.2.0  # ✅ Migrated from ^6.3.0 (2025-11-27) - singleton pattern
  sign_in_with_apple: ^7.0.0  # Upgraded for Flutter Android embedding compatibility
  
  # State Management
  # ✅ MEMORY FIX: Upgraded from ^2.4.9 to ^2.6.1 (2025-11-29)
  # - v2.5.0: Fixed FutureProvider memory leak
  # - v2.5.1: Fixed provider rebuild memory issues
  # - v2.6.x: Multiple memory optimizations
  flutter_riverpod: ^2.6.1

  # Functional Programming (Clean Architecture)
  fpdart: ^1.1.0

  # Storage & Persistence
  hive_ce_flutter: ^2.1.0  # ✅ Migrated from abandoned hive_flutter (2025-11-27)
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  
  # Utilities
  uuid: ^4.5.1
  fuzzy_bolt: ^2.0.0  # Fuzzy matching for exercise search

  # Background & Timer
  flutter_background_service: ^5.0.5
  audioplayers: ^6.5.1  # Current latest (^6.5.2 not yet published)
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1  # For scheduled notifications
  
  # HealthKit & Fitness (Task 4.1: AI Coach health data integration)
  health: ^13.2.1  # Latest version with HealthKit + Health Connect support
  permission_handler: ^12.0.1  # Migrated from ^11.0.1 (2025-11-27)
  device_info_plus: ^12.2.0  # For Android API level checks (Task 5.6)
  speech_to_text: ^7.1.0  # Voice input for AI Coach (Phase 3.1)
  
  # Navigation & UI
  go_router: ^17.0.0  # ✅ Migrated from ^12.1.3 (2025-11-27) - case-sensitive URLs
  flutter_animate: ^4.3.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.1
  
  # Utils
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  connectivity_plus: ^7.0.0  # Migrated from ^6.0.5 (2025-11-27)
  timeago: ^3.7.0  # Relative time formatting
  flutter_dotenv: ^6.0.0  # 🔐 SECURITY: Migrated from ^5.1.0 (2025-11-27)

  # PDF Generation & Sharing
  pdf: ^3.11.0
  printing: ^5.13.0
  equatable: ^2.0.5
  share_plus: ^12.0.1  # Migrated from ^10.1.0 (2025-11-27)
  csv: ^6.0.0

  # Firebase Functions
  cloud_functions: ^6.0.3

  # UI Components
  visibility_detector: ^0.4.0+2

  # AdMob Integration
  google_mobile_ads: ^6.0.0  # ✅ Migrated from ^5.1.0 (2025-11-27) - minSdk 23

  # Icons
  cupertino_icons: ^1.0.8

  # Code generation
  freezed_annotation: ^3.1.0  # Migrated from ^2.4.1 (2025-11-27)
  json_annotation: ^4.8.1
  rxdart: ^0.28.0
  fl_chart: ^1.1.0
  wakelock_plus: ^1.4.0
  crypto: ^3.0.6
  table_calendar: ^3.1.2

  # Data Visualization & Animations (Analytics Feature)
  percent_indicator: ^4.2.3

  path_provider: any
  sensors_plus: any
  hive_ce: ^2.6.0  # ✅ Migrated from abandoned hive (2025-11-27)
  file_picker: any
  collection: any
  image_picker: any
  in_app_purchase: any
  battery_plus: any
  shimmer: any

  # 🔒 Concurrent access safety
  synchronized: ^3.3.0+3
  flutter_cache_manager: any
  flutter_slidable: ^4.0.3

  # 🔍 Unified logging + HTTP inspector (debug builds)
  voo_logging: ^0.4.7
  calendar_date_picker2: ^2.0.1
  muscle_selector: ^1.0.4
  svg_path_parser: ^1.1.2
  flutter_svg: ^2.2.3
  motor: ^1.1.0
  tutorial_coach_mark: ^1.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  
  # Code generation
  build_runner: ^2.4.7
  freezed: ^3.2.3  # Migrated from ^2.4.6 (2025-11-27)
  json_serializable: ^6.7.1
  hive_ce_generator: ^1.4.0  # ✅ Migrated from abandoned hive_generator (2025-11-27)
  
  # Testing - Patrol for native feature testing
  patrol: ^3.10.0
  patrol_finders: ^2.3.0
  
  # Testing - Mocking
  mocktail: ^1.0.4
  fake_cloud_firestore: ^4.0.0
  firebase_auth_mocks: ^0.15.1  # Fix per test auth flow - compatibile con firebase_core ^4.2.0

  # 🔍 Memory leak detection
  leak_tracker_flutter_testing: ^3.0.5

  # 🔍 Unified logging + HTTP inspector (replaces alice)
  voo_logging: ^0.4.7

  # 🎨 Golden testing framework (by Very Good Ventures)
  alchemist: ^0.13.0

  # 🧪 Widget test toolkit with auto screenshots
  spot: ^0.18.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
  test_api: any
  firebase_core_platform_interface: any
  mockito: any
  state_notifier: any
  cloud_firestore_platform_interface: any
  firebase_auth_platform_interface: any
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
    - assets/i18n/
    - docs/legal/PRIVACY_POLICY_IT.md
    - docs/legal/PRIVACY_POLICY_EN.md
    - docs/legal/TERMS_OF_SERVICE_IT.md
    - docs/legal/TERMS_OF_SERVICE_EN.md
    - assets/data/
    - .env  # 🔐 SECURITY: Environment variables (gitignored)

  # Enable generation of the app_localizations.dart file
  generate: true

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

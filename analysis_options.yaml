# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - backup_storage_system_20250924_230518/**
    - gymbro_flutter_new_buildconiosrotto/**
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # Exclude utility scripts from strict linting (print statements are OK here)
    - scripts/**
    - assets/data/scripts/**
    # Note: test/ folder keeps linting but print() in tests is acceptable for debugging

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule
    
    # Internationalization rules to prevent hardcoded strings
    prefer_single_quotes: true
    # Enforce avoid_print in production code (scripts/ and assets/data/scripts/ are excluded above)
    avoid_print: true
    
    # Additional strict rules for better code quality
    always_declare_return_types: true
    always_use_package_imports: true
    avoid_relative_lib_imports: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    sort_constructors_first: true
    sort_unnamed_constructors_first: true
    unawaited_futures: true

    # 🎨 Design System Enforcement
    # These rules help enforce design guidelines automatically
    use_key_in_widget_constructors: true  # Better widget lifecycle
    sized_box_for_whitespace: true  # Use SizedBox instead of Container for spacing
    avoid_unnecessary_containers: true  # Performance optimization
    use_full_hex_values_for_flutter_colors: true  # Color consistency
    prefer_const_literals_to_create_immutables: true  # Performance

    # Code Quality & Safety
    require_trailing_commas: true  # Better git diffs
    unnecessary_late: true  # Avoid unnecessary late keyword
    unnecessary_nullable_for_final_variable_declarations: true  # Type safety
    use_build_context_synchronously: true  # Async safety
    use_colored_box: true  # Performance over Container
    use_decorated_box: true  # Performance over Container

    # Accessibility & UX
    use_super_parameters: true  # Cleaner constructors

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
